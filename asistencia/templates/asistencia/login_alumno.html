<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso alumno | PRESENTE</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #f8fbff 55%,
                    #f3f8ff 100%
                );

            color: #102348;
        }


        /* ==================================================
           PÁGINA
        ================================================== */

        .pagina-acceso {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 25px;
        }


        .acceso-contenedor {
            width: 100%;
            max-width: 500px;

            text-align: center;
        }


        /* ==================================================
           MARCA PRESENTE
        ================================================== */

        .marca {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-bottom: 38px;
        }


        .logo-simbolo {
            width: 68px;
            height: 68px;

            position: relative;

            flex-shrink: 0;
        }


        .esquina {
            position: absolute;

            width: 23px;
            height: 23px;
        }


        .esquina-1 {
            top: 0;
            left: 0;

            border-top: 6px solid #176df5;
            border-left: 6px solid #176df5;

            border-radius: 8px 0 0 0;
        }


        .esquina-2 {
            top: 0;
            right: 0;

            border-top: 6px solid #00c86f;
            border-right: 6px solid #00c86f;

            border-radius: 0 8px 0 0;
        }


        .esquina-3 {
            bottom: 0;
            left: 0;

            border-bottom: 6px solid #ff2f8b;
            border-left: 6px solid #ff2f8b;

            border-radius: 0 0 0 8px;
        }


        .esquina-4 {
            bottom: 0;
            right: 0;

            border-bottom: 6px solid #15966e;
            border-right: 6px solid #15966e;

            border-radius: 0 0 8px 0;
        }


        .check {
            position: absolute;

            left: 50%;
            top: 48%;

            width: 31px;
            height: 17px;

            border-left: 7px solid #102348;
            border-bottom: 7px solid #102348;

            transform:
                translate(-50%, -50%)
                rotate(-45deg);

            border-radius: 2px;
        }


        .marca-texto {
            text-align: left;
        }


        .marca-texto h1 {
            font-size: 35px;

            line-height: 1;

            letter-spacing: 1px;

            font-weight: 900;

            color: #102348;
        }


        .marca-texto p {
            margin-top: 5px;

            font-size: 16px;

            font-weight: 600;

            color: #102348;
        }


        .marca-texto strong {
            color: #176df5;

            font-weight: 900;
        }


        /* ==================================================
           TARJETA
        ================================================== */

        .tarjeta-acceso {
            width: 100%;

            background: #ffffff;

            border: 1px solid #e1e8f0;

            border-radius: 18px;

            padding: 40px 42px;

            box-shadow:
                0 18px 50px
                rgba(16, 35, 72, 0.08);

            text-align: left;
        }


        .cabecera-tarjeta {
            text-align: center;

            margin-bottom: 31px;
        }


        /* ==================================================
           ICONO ALUMNO
        ================================================== */

        .icono-acceso {
            width: 62px;
            height: 62px;

            margin:
                0
                auto
                18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: #edf5ff;

            color: #176df5;
        }


        .icono-acceso svg {
            width: 35px;
            height: 35px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        .etiqueta {
            color: #176df5;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2.5px;

            margin-bottom: 9px;
        }


        .cabecera-tarjeta h2 {
            color: #102348;

            font-size: 31px;

            font-weight: 850;
        }


        .subtitulo-acceso {
            margin-top: 8px;

            color: #71809a;

            font-size: 14px;
        }


        /* ==================================================
           MENSAJES
        ================================================== */

        .mensaje-error {
            margin-bottom: 20px;

            padding: 12px 14px;

            background: #fff1f3;

            border: 1px solid #ffc6d7;

            border-radius: 9px;

            color: #c51e52;

            font-size: 13px;

            font-weight: 600;
        }


        /* ==================================================
           FORMULARIO
        ================================================== */

        .formulario-acceso {
            width: 100%;
        }


        .campo-formulario {
            margin-bottom: 19px;
        }


        .campo-formulario label {
            display: block;

            margin-bottom: 8px;

            color: #102348;

            font-size: 13px;

            font-weight: 700;
        }


        .campo-formulario input {
            width: 100%;
            height: 48px;

            padding:
                0
                15px;

            background: #f8fbff;

            border: 1px solid #d7e1ee;

            border-radius: 9px;

            color: #102348;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }


        .campo-formulario input::placeholder {
            color: #9aa7ba;
        }


        .campo-formulario input:focus {
            background: #ffffff;

            border-color: #176df5;

            box-shadow:
                0 0 0 3px
                rgba(23, 109, 245, 0.10);
        }


        /* ==================================================
           BOTÓN
        ================================================== */

        .boton-acceso {
            width: 100%;
            height: 49px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: #176df5;

            color: #ffffff;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 6px 15px
                rgba(23, 109, 245, 0.18);

            transition:
                background .2s ease,
                transform .2s ease,
                box-shadow .2s ease;
        }


        .boton-acceso:hover {
            background: #105fd8;

            transform: translateY(-1px);

            box-shadow:
                0 8px 19px
                rgba(23, 109, 245, 0.24);
        }


        .boton-acceso:active {
            transform: translateY(0);
        }


        /* ==================================================
           REGISTRO
        ================================================== */

        .registro-acceso {
            margin-top: 25px;

            padding-top: 23px;

            border-top: 1px solid #e5eaf1;

            text-align: center;
        }


        .registro-acceso p {
            margin-bottom: 7px;

            color: #71809a;

            font-size: 13px;
        }


        .registro-acceso a {
            color: #176df5;

            font-size: 14px;

            font-weight: 800;

            text-decoration: none;

            transition: color .2s ease;
        }


        .registro-acceso a:hover {
            color: #105fd8;
        }


        /* ==================================================
           VOLVER
        ================================================== */

        .zona-volver {
            text-align: center;

            margin-top: 23px;
        }


        .volver-acceso {
            display: inline-block;

            color: #60708d;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: color .2s ease;
        }


        .volver-acceso:hover {
            color: #176df5;
        }


        /* ==================================================
           MÓVIL
        ================================================== */

        @media (max-width: 600px) {

            .pagina-acceso {
                align-items: flex-start;

                padding:
                    32px
                    17px;
            }


            .marca {
                margin-bottom: 29px;
            }


            .logo-simbolo {
                width: 58px;
                height: 58px;
            }


            .esquina {
                width: 19px;
                height: 19px;
            }


            .check {
                width: 27px;
                height: 15px;

                border-left-width: 6px;
                border-bottom-width: 6px;
            }


            .marca-texto h1 {
                font-size: 29px;
            }


            .marca-texto p {
                font-size: 14px;
            }


            .tarjeta-acceso {
                padding:
                    32px
                    22px;
            }


            .cabecera-tarjeta h2 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<main class="pagina-acceso">

    <div class="acceso-contenedor">


        <!-- ================================================
             MARCA
        ================================================= -->

        <div class="marca">

            <div class="logo-simbolo">

                <span class="esquina esquina-1"></span>
                <span class="esquina esquina-2"></span>
                <span class="esquina esquina-3"></span>
                <span class="esquina esquina-4"></span>

                <span class="check"></span>

            </div>


            <div class="marca-texto">

                <h1>
                    PRESENTE
                </h1>

                <p>
                    by <strong>RETORIKA</strong>
                </p>

            </div>

        </div>


        <!-- ================================================
             TARJETA
        ================================================= -->

        <section class="tarjeta-acceso">


            <div class="cabecera-tarjeta">


                <!-- ICONO ALUMNO -->

                <div class="icono-acceso">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M3 9l9-5 9 5-9 5-9-5z"
                        ></path>

                        <path
                            d="M7 12v4c3 2 7 2 10 0v-4"
                        ></path>

                        <path
                            d="M21 9v6"
                        ></path>

                    </svg>

                </div>


                <p class="etiqueta">
                    ALUMNO
                </p>


                <h2>
                    Acceso alumno
                </h2>


                <p class="subtitulo-acceso">
                    Introduce tus datos para acceder.
                </p>

            </div>


            <!-- ============================================
                 MENSAJES DJANGO
            ============================================= -->

            {% if messages %}

                {% for message in messages %}

                    <div class="mensaje-error">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <!-- ============================================
                 FORMULARIO
            ============================================= -->

            <form
                method="POST"
                class="formulario-acceso"
            >

                {% csrf_token %}


                <div class="campo-formulario">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nombre@correo.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="campo-formulario">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Introduce tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="boton-acceso"
                >
                    Entrar
                </button>

            </form>


            <!-- ============================================
                 REGISTRO
            ============================================= -->

            <div class="registro-acceso">

                <p>
                    ¿Todavía no estás registrado?
                </p>

                <a href="{% url 'registro_alumno' %}">
                    Crear cuenta
                </a>

            </div>


            <!-- ============================================
                 VOLVER
            ============================================= -->

            <div class="zona-volver">

                <a
                    href="{% url 'seleccionar_login' %}"
                    class="volver-acceso"
                >
                    ← Volver
                </a>

            </div>


        </section>

    </div>

</main>


</body>

</html>
