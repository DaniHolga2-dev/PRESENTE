<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro profesor | PRESENTE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #f8fbff 55%,
                    #f3f8ff 100%
                );

            color: #102348;
        }


        /* ==================================================
           PÁGINA
        ================================================== */

        .pagina-registro {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 25px;
        }

        .registro-contenedor {
            width: 100%;
            max-width: 620px;

            text-align: center;
        }


        /* ==================================================
           MARCA PRESENTE
        ================================================== */

        .marca {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 18px;

            margin-bottom: 38px;
        }

        .logo-simbolo {
            width: 68px;
            height: 68px;

            position: relative;

            flex-shrink: 0;
        }

        .esquina {
            position: absolute;

            width: 23px;
            height: 23px;
        }

        .esquina-1 {
            top: 0;
            left: 0;

            border-top: 6px solid #176df5;
            border-left: 6px solid #176df5;

            border-radius: 8px 0 0 0;
        }

        .esquina-2 {
            top: 0;
            right: 0;

            border-top: 6px solid #00c86f;
            border-right: 6px solid #00c86f;

            border-radius: 0 8px 0 0;
        }

        .esquina-3 {
            bottom: 0;
            left: 0;

            border-bottom: 6px solid #ff2f8b;
            border-left: 6px solid #ff2f8b;

            border-radius: 0 0 0 8px;
        }

        .esquina-4 {
            bottom: 0;
            right: 0;

            border-bottom: 6px solid #15966e;
            border-right: 6px solid #15966e;

            border-radius: 0 0 8px 0;
        }

        .check {
            position: absolute;

            left: 50%;
            top: 48%;

            width: 31px;
            height: 17px;

            border-left: 7px solid #102348;
            border-bottom: 7px solid #102348;

            transform:
                translate(-50%, -50%)
                rotate(-45deg);

            border-radius: 2px;
        }

        .marca-texto {
            text-align: left;
        }

        .marca-texto h1 {
            color: #102348;

            font-size: 35px;
            line-height: 1;

            letter-spacing: 1px;

            font-weight: 900;
        }

        .marca-texto p {
            margin-top: 5px;

            color: #102348;

            font-size: 16px;
            font-weight: 600;
        }

        .marca-texto strong {
            color: #176df5;

            font-weight: 900;
        }


        /* ==================================================
           TARJETA
        ================================================== */

        .tarjeta-registro {
            width: 100%;

            padding: 40px 42px;

            background: #ffffff;

            border: 1px solid #e1e8f0;
            border-radius: 18px;

            box-shadow:
                0 18px 50px
                rgba(16, 35, 72, 0.08);

            text-align: left;
        }

        .cabecera-tarjeta {
            margin-bottom: 31px;

            text-align: center;
        }


        /* ==================================================
           ICONO PROFESOR
        ================================================== */

        .icono-registro {
            width: 62px;
            height: 62px;

            margin:
                0
                auto
                18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: #edf5ff;

            color: #176df5;
        }

        .icono-registro svg {
            width: 34px;
            height: 34px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .etiqueta {
            margin-bottom: 9px;

            color: #176df5;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 2.5px;
        }

        .cabecera-tarjeta h2 {
            color: #102348;

            font-size: 31px;
            font-weight: 850;
        }

        .subtitulo-registro {
            margin-top: 8px;

            color: #71809a;

            font-size: 14px;
            line-height: 1.5;
        }


        /* ==================================================
           MENSAJES
        ================================================== */

        .mensaje {
            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 9px;

            font-size: 13px;
            font-weight: 600;
        }

        .mensaje-error {
            background: #fff1f3;

            border: 1px solid #ffc6d7;

            color: #c51e52;
        }

        .mensaje-success {
            background: #ecfdf3;

            border: 1px solid #a6f4c5;

            color: #027a48;
        }


        /* ==================================================
           FORMULARIO
        ================================================== */

        .formulario-registro {
            width: 100%;
        }

        .fila-formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 16px;
        }

        .campo-formulario {
            margin-bottom: 19px;
        }

        .campo-formulario label {
            display: block;

            margin-bottom: 8px;

            color: #102348;

            font-size: 13px;
            font-weight: 700;
        }

        .opcional {
            color: #98a2b3;

            font-size: 11px;
            font-weight: 500;
        }

        .campo-formulario input {
            width: 100%;
            height: 48px;

            padding:
                0
                15px;

            background: #f8fbff;

            border: 1px solid #d7e1ee;
            border-radius: 9px;

            color: #102348;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .campo-formulario input::placeholder {
            color: #9aa7ba;
        }

        .campo-formulario input:focus {
            background: #ffffff;

            border-color: #176df5;

            box-shadow:
                0 0 0 3px
                rgba(23, 109, 245, 0.10);
        }


        /* ==================================================
           FOTO
        ================================================== */

        .campo-formulario input[type="file"] {
            height: auto;

            padding: 11px 12px;

            background: #f8fbff;

            cursor: pointer;
        }

        .campo-formulario input[type="file"]::file-selector-button {
            margin-right: 12px;

            padding: 8px 12px;

            border: 0;
            border-radius: 7px;

            background: #eaf2ff;

            color: #176df5;

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }


        /* ==================================================
           AYUDA CONTRASEÑA
        ================================================== */

        .ayuda-campo {
            display: block;

            margin-top: 6px;

            color: #98a2b3;

            font-size: 11px;
            line-height: 1.4;
        }


        /* ==================================================
           BOTÓN
        ================================================== */

        .boton-registro {
            width: 100%;
            height: 49px;

            margin-top: 5px;

            border: none;
            border-radius: 9px;

            background: #176df5;

            color: #ffffff;

            font-family: inherit;
            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 6px 15px
                rgba(23, 109, 245, 0.18);

            transition:
                background .2s ease,
                transform .2s ease,
                box-shadow .2s ease;
        }

        .boton-registro:hover {
            background: #105fd8;

            transform: translateY(-1px);

            box-shadow:
                0 8px 19px
                rgba(23, 109, 245, 0.24);
        }

        .boton-registro:active {
            transform: translateY(0);
        }


        /* ==================================================
           VOLVER / LOGIN
        ================================================== */

        .zona-volver {
            margin-top: 24px;

            text-align: center;
        }

        .volver-acceso {
            display: inline-block;

            color: #60708d;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            transition: color .2s ease;
        }

        .volver-acceso:hover {
            color: #176df5;
        }

        .zona-login {
            margin-top: 24px;
            padding-top: 22px;

            border-top: 1px solid #e7edf5;

            text-align: center;
        }

        .zona-login p {
            margin-bottom: 7px;

            color: #71809a;

            font-size: 14px;
        }

        .enlace-login {
            color: #176df5;

            font-size: 14px;
            font-weight: 800;

            text-decoration: none;

            transition: color .2s ease;
        }

        .enlace-login:hover {
            color: #105fd8;

            text-decoration: underline;
        }


        /* ==================================================
           MÓVIL
        ================================================== */

        @media (max-width: 600px) {

            .pagina-registro {
                align-items: flex-start;

                padding:
                    32px
                    17px;
            }

            .registro-contenedor {
                max-width: 500px;
            }

            .marca {
                margin-bottom: 29px;
            }

            .logo-simbolo {
                width: 58px;
                height: 58px;
            }

            .esquina {
                width: 19px;
                height: 19px;
            }

            .check {
                width: 27px;
                height: 15px;

                border-left-width: 6px;
                border-bottom-width: 6px;
            }

            .marca-texto h1 {
                font-size: 29px;
            }

            .marca-texto p {
                font-size: 14px;
            }

            .tarjeta-registro {
                padding:
                    32px
                    22px;
            }

            .cabecera-tarjeta h2 {
                font-size: 27px;
            }

            .fila-formulario {
                grid-template-columns: 1fr;

                gap: 0;
            }
        }
    </style>
</head>


<body>

<main class="pagina-registro">

    <div class="registro-contenedor">


        <!-- ================================================
             MARCA
        ================================================= -->

        <div class="marca">

            <div class="logo-simbolo">

                <span class="esquina esquina-1"></span>
                <span class="esquina esquina-2"></span>
                <span class="esquina esquina-3"></span>
                <span class="esquina esquina-4"></span>

                <span class="check"></span>

            </div>


            <div class="marca-texto">

                <h1>
                    PRESENTE
                </h1>

                <p>
                    by <strong>RETORIKA</strong>
                </p>

            </div>

        </div>


        <!-- ================================================
             TARJETA REGISTRO
        ================================================= -->

        <section class="tarjeta-registro">

            <div class="cabecera-tarjeta">

                <div class="icono-registro">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="9"
                            cy="7"
                            r="3"
                        ></circle>

                        <path
                            d="M3 20v-2a6 6 0 0112 0v2"
                        ></path>

                        <path
                            d="M18 8v6"
                        ></path>

                        <path
                            d="M15 11h6"
                        ></path>

                    </svg>

                </div>


                <p class="etiqueta">
                    PROFESOR
                </p>

                <h2>
                    Crear cuenta
                </h2>

                <p class="subtitulo-registro">
                    Introduce tus datos para crear tu cuenta de profesor.
                </p>

            </div>


            <!-- ============================================
                 MENSAJES DJANGO
            ============================================= -->

            {% if messages %}

                {% for message in messages %}

                    <div class="mensaje {% if message.tags == 'success' %}mensaje-success{% else %}mensaje-error{% endif %}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <!-- ============================================
                 FORMULARIO
            ============================================= -->

            <form
                method="POST"
                enctype="multipart/form-data"
                class="formulario-registro"
            >

                {% csrf_token %}


                <!-- NOMBRE Y APELLIDOS -->

                <div class="fila-formulario">

                    <div class="campo-formulario">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            value="{{ request.POST.nombre|default:'' }}"
                            placeholder="Introduce tu nombre"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <div class="campo-formulario">

                        <label for="apellidos">
                            Apellidos
                        </label>

                        <input
                            type="text"
                            id="apellidos"
                            name="apellidos"
                            value="{{ request.POST.apellidos|default:'' }}"
                            placeholder="Introduce tus apellidos"
                            autocomplete="family-name"
                            required
                        >

                    </div>

                </div>


                <!-- USUARIO -->

                <div class="campo-formulario">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        value="{{ request.POST.username|default:'' }}"
                        placeholder="Elige un nombre de usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="campo-formulario">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ request.POST.email|default:'' }}"
                        placeholder="nombre@correo.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- CONTRASEÑAS -->

                <div class="fila-formulario">

                    <div class="campo-formulario">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Introduce una contraseña"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <span class="ayuda-campo">
                            Mínimo 8 caracteres.
                        </span>

                    </div>


                    <div class="campo-formulario">

                        <label for="password2">
                            Repetir contraseña
                        </label>

                        <input
                            type="password"
                            id="password2"
                            name="password2"
                            placeholder="Repite la contraseña"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>

                </div>


                <!-- FOTO -->

                <div class="campo-formulario">

                    <label for="foto">
                        Foto de perfil
                        <span class="opcional">
                            (opcional)
                        </span>
                    </label>

                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                    >

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="boton-registro"
                >
                    Crear cuenta
                </button>

            </form>


            <!-- ============================================
                 VOLVER
            ============================================= -->

            <div class="zona-volver">

                <a
                    href="{% url 'seleccionar_login' %}"
                    class="volver-acceso"
                >
                    ← Volver
                </a>

            </div>


            <!-- ============================================
                 YA TIENE CUENTA
            ============================================= -->

            <div class="zona-login">

                <p>
                    ¿Ya tienes una cuenta?
                </p>

                <a
                    href="{% url 'login_profesor' %}"
                    class="enlace-login"
                >
                    Iniciar sesión
                </a>

            </div>

        </section>

    </div>

</main>

</body>

</html>
