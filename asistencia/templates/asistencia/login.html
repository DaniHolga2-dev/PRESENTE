{% extends 'asistencia/base.html' %}

{% block title %}
Iniciar sesión | PRESENTE
{% endblock %}


{% block content %}

<section class="inicio">

    <div class="inicio-contenido">

        <p class="inicio-etiqueta">
            ACCESO
        </p>

        <h1 style="
            font-size: 42px;
            color: #101828;
        ">
            Iniciar sesión
        </h1>

        <p class="inicio-descripcion">
            Selecciona tu tipo de usuario.
        </p>


        <div
            style="
                display: flex;
                justify-content: center;
                gap: 25px;
                flex-wrap: wrap;
                margin-top: 45px;
            "
        >

            <!-- PROFESOR -->

            <a
                href="{% url 'login_profesor' %}"
                class="boton-login"
                style="
                    text-decoration: none;
                    background: #105CB1;
                    color: #FFFFFF;
                    padding: 16px 35px;
                    border-radius: 8px;
                    font-weight: 600;
                    box-shadow: 0 5px 12px rgba(16, 92, 177, 0.18);
                    transition:
                        background-color 0.2s ease,
                        transform 0.2s ease,
                        box-shadow 0.2s ease;
                "
                onmouseover="
                    this.style.backgroundColor='#0D4D96';
                    this.style.transform='translateY(-1px)';
                    this.style.boxShadow='0 7px 16px rgba(16, 92, 177, 0.22)';
                "
                onmouseout="
                    this.style.backgroundColor='#105CB1';
                    this.style.transform='translateY(0)';
                    this.style.boxShadow='0 5px 12px rgba(16, 92, 177, 0.18)';
                "
            >
                Profesor
            </a>


            <!-- ALUMNO -->

            <a
                href="{% url 'login_alumno' %}"
                style="
                    text-decoration: none;
                    background: #156FE7;
                    color: #FFFFFF;
                    padding: 16px 35px;
                    border-radius: 8px;
                    font-weight: 600;
                    box-shadow: 0 5px 12px rgba(21, 111, 231, 0.18);
                    transition:
                        background-color 0.2s ease,
                        transform 0.2s ease,
                        box-shadow 0.2s ease;
                "
                onmouseover="
                    this.style.backgroundColor='#105CB1';
                    this.style.transform='translateY(-1px)';
                    this.style.boxShadow='0 7px 16px rgba(16, 92, 177, 0.22)';
                "
                onmouseout="
                    this.style.backgroundColor='#156FE7';
                    this.style.transform='translateY(0)';
                    this.style.boxShadow='0 5px 12px rgba(21, 111, 231, 0.18)';
                "
            >
                Alumno
            </a>

        </div>

    </div>

</section>

{% endblock %}
